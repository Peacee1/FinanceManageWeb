server {
 listen 443 ssl;
 server_name beatmaker.peacee1.io.vn;
 root /usr/share/nginx/peacee1-beatmaker;
 index index.html;
 ssl_certificate /etc/letsencrypt/live/beatmaker.peacee1.io.vn/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/beatmaker.peacee1.io.vn/privkey.pem;
 include /etc/letsencrypt/options-ssl-nginx.conf;
 ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
 location ^~ /api/ {
  proxy_pass http://127.0.0.1:5000;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache, must-revalidate"; }
}
server {
 listen 80;
 server_name beatmaker.peacee1.io.vn;
 root /usr/share/nginx/peacee1-beatmaker;
 location /.well-known/acme-challenge/ { try_files $uri =404; }
 location / { return 301 https://$host$request_uri; }
}
