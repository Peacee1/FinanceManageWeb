<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Peacee1 Tasks</title><link rel="stylesheet" href="/style.css?v=monochrome24"><link rel="stylesheet" href="/refinements.css?v=monochrome24"><script defer src="/theme.js?v=monochrome24"></script><script defer src="/language.js?v=monochrome24"></script><script defer src="/app.js?v=monochrome24"></script></head><body>
<a class="brand" href="https://peacee1.io.vn/"><img id="brand-logo" src="/assets/tasks-monochrome.svg" alt="" width="48" height="48"><span>Peacee1<small>TASKS</small></span></a>
<nav class="tabbar" aria-label="Điều hướng chính"><button data-view="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 6 2 2 3-3M12 6h8M4 13l2 2 3-3M12 13h8M4 20h16"/></svg><span>To do</span></button><button data-view="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18"/></svg><span>Lịch</span></button><button id="add-task" class="create" aria-label="Tạo to do"><span>＋</span></button><button data-view="focus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><path d="M12 9v5l3 2M9 2h6"/></svg><span>Quick Focus</span></button><button data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span>Cài đặt</span></button></nav>
<div class="workspace"><header><div><small id="greeting"></small><h1 id="title">To do</h1></div><div class="desktop-arrows"><button id="prev-tab" aria-label="Tab trước">↑</button><button id="next-tab" aria-label="Tab sau">↓</button></div><span id="mode-badge" class="pill">Cá nhân</span></header><p id="error" role="alert"></p><main id="content"></main>
<section id="settings-panel" hidden><div class="profile-card card"><div id="profile-avatar"></div><h2 id="profile-name"></h2><small id="profile-email"></small><div class="profile-stats"><div><small>CHẾ ĐỘ</small><p id="profile-mode"></p></div><div><small>CÔNG VIỆC</small><p id="profile-count"></p></div></div></div><p class="section-label">KHÔNG GIAN LÀM VIỆC</p><div class="card" id="workspace-settings"><h2>Chế độ sử dụng</h2><p class="muted">Chọn công việc cá nhân hoặc không gian nhóm.</p><button id="personal">Cá nhân</button><div id="spaces"></div><button id="add-space" class="primary">＋ Tạo nhóm</button><div class="group-actions"><button data-view="chat" id="chat-tab" hidden>Chat nhóm →</button><button id="members" hidden>Thành viên →</button></div></div><p class="section-label">ỨNG DỤNG</p><div class="card" id="application-settings"><div id="theme-controls"><label class="theme-choice">Giao diện<select id="theme"><option value="monochrome">Đen trắng</option><option value="purple">Tím</option><option value="pink">Hồng</option><option value="green">Xanh lá</option><option value="blue">Xanh dương</option><option value="yellow">Vàng</option></select></label><label>Chế độ hiển thị<select id="appearance"><option value="dark">Tối</option><option value="light">Sáng</option><option value="system">Theo thiết bị</option></select></label></div><div id="language-control"><label>Ngôn ngữ<select id="language"><option value="vi">Tiếng Việt</option><option value="en">English</option><option value="zh">中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="ru">Русский</option></select></label></div><button id="logout" class="setting-link danger">Đăng xuất →</button><button data-view="habits" class="setting-link">Thói quen →</button><a class="setting-link" href="https://peacee1.io.vn/account.html">Thông tin tài khoản →</a><a class="setting-link" href="https://peacee1.io.vn/">Trang chính →</a></div><div id="mobile-settings"></div></section></div>
<dialog id="modal"><form id="form"><div class="row"><h2 id="modal-title"></h2><button type="button" id="close" aria-label="Đóng">×</button></div><div id="fields"></div><p id="form-error" role="alert"></p><footer><button type="button" id="cancel">Hủy</button><button class="primary" type="submit">Lưu</button></footer></form></dialog></body></html>
