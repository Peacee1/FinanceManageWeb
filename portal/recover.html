<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account recovery — Peacee1</title><link rel="stylesheet" href="/auth.css"><script defer src="/captcha.js?v=english-20261025"></script><script defer src="/recover.js?v=english-20261025"></script></head><body><header><a class="brand" href="/">Peacee1</a><a href="/login">Sign in ↗</a></header><main class="account-page"><section class="card"><h2 id="recovery-title">Forgot password</h2><p id="recovery-description">Receive a code by email to reset your password</p><p id="message" role="status" aria-live="polite"></p><form id="request-form"><label for="email">Account email</label><input id="email" type="email" autocomplete="email" maxlength="255" required><button class="submit" id="send">Send email code</button></form><form id="verify-form"><label for="code">6-digit verification code</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><div id="new-password-fields"><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" required><small>At least 8 characters, including uppercase and lowercase letters, a number and a symbol.</small></div><button class="submit" id="verify">Reset password</button></form><p><a href="/login">Back to sign in</a></p></section></main></body></html>
